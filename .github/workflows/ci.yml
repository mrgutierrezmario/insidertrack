# Tests, a build of the production image, and — on main and on version tags
# — a push of that image to GHCR, where the staging cluster pulls it
# (github.com/mrgutierrezmario/homelab-gitops). Production still builds from
# source on the server (deploy/start.sh).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Nightly — most of the backend is scrapers against government HTML/PDF
    # fixtures, so a green run once a day is cheap insurance that the parsers
    # and their deps still agree.
    - cron: "17 6 * * *"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui_backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t -d t"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://t:t@localhost:5432/t
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/ui_backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Create schema + run migrations
        run: python -c "from database import init_db; init_db()"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui_frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui_frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    # The production image is the only thing that actually runs — make sure it
    # still builds (UI bundle + backend deps) on every change. On main and on
    # tags the build is also pushed, one arch per native runner (the UI build
    # under QEMU would take ten minutes), merged into one manifest below.
    runs-on: ${{ matrix.runner }}
    needs: [backend, frontend]
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          # Pushed by digest only; the merge job attaches the tags.
          outputs: ${{ github.event_name == 'push' && format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push-image:
    name: Tag the image on GHCR
    if: github.event_name == 'push'
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # main → :main (staging follows it) + :main-<sha>; v1.2.3 → :1.2.3, :1.2, :latest
          tags: |
            type=ref,event=branch
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Merge the per-arch digests under the tags
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
