name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly — most of the backend is scrapers against government HTML/PDF
    # fixtures, so a green run once a day is cheap insurance that the parsers
    # and their deps still agree.
    - cron: "17 6 * * *"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui_backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t -d t"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://t:t@localhost:5432/t
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/ui_backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Create schema + run migrations
        run: python -c "from database import init_db; init_db()"
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ui_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/ui_frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    # The production image is the only thing that actually runs — make sure it
    # still builds (UI bundle + backend deps) on every change.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
