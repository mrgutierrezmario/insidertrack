# Development helper only: a throwaway Postgres for start.sh when no local
# PostgreSQL is running. The production stack (app + Postgres + Tailscale
# Funnel) is deploy/compose.yml — start it with deploy/start.sh.
services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: app/ui_backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Published on 54329 (not 5432/5433) so it never collides with a local Postgres
    # or a port VS Code has auto-forwarded from a devcontainer.
    # start.sh points the app here when it starts this container; override
    # the port with DEV_DB_PORT if 54329 is taken on your machine.
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-54329}:5432"

volumes:
  pgdata:
