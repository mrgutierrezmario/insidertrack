# Development helper only: a throwaway Postgres for start.sh when no local
# PostgreSQL is running. The production stack (app + Postgres + Tailscale
# Funnel) is deploy/compose.yml — start it with deploy/start.sh.
services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: app/ui_backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No host port published — only the app container talks to it.
    # Uncomment to allow psql from the host:
    # ports:
    #   - "5433:5432"

volumes:
  pgdata:
